name: ForkLoop CI/CD Pipeline

on:
  push:
    branches: [main, develop, "jz/*"]
  pull_request:
    branches: [main, develop]

jobs:
  # Lint and Code Quality Check
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{js,jsx,css,json}"

  # Build Test
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 7

  # API Integration Tests
  api-tests:
    name: 🧪 API Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start development server
        run: |
          echo "🚀 Starting development server..."
          npm run dev:ci &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 10
        env:
          NODE_ENV: test
          CI: true

      - name: Wait for server and test
        run: |
          echo "⏳ Waiting for server to be ready..."
          # Try to wait for server with timeout
          timeout 120 bash -c 'until curl -f http://localhost:3000/stage_1_forkloop_frontend/ > /dev/null 2>&1; do sleep 2; echo "Waiting..."; done' || {
            echo "❌ Server failed to start within timeout"
            echo "Checking if any process is running on port 3000..."
            netstat -tulpn | grep :3000 || echo "No process found on port 3000"
            ps aux | grep node || echo "No node processes found"
            exit 1
          }
          echo "✅ Server is responding"

  # Component Tests (Smoke Tests)
  component-tests:
    name: ⚡ Component Smoke Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start development server
        run: |
          echo "🚀 Starting development server..."
          npm run dev:ci &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 10
        env:
          NODE_ENV: test
          CI: true

      - name: Component smoke tests
        run: |
          echo "⏳ Waiting for server to be ready..."
          # Wait for server with timeout
          timeout 120 bash -c 'until curl -f http://localhost:3000/stage_1_forkloop_frontend/ > /dev/null 2>&1; do sleep 2; echo "Waiting..."; done' || {
            echo "❌ Server failed to start within timeout"
            exit 1
          }

          echo "🏠 Testing main app..."
          curl -f http://localhost:3000/stage_1_forkloop_frontend/ > /dev/null
          echo "✅ Main app is responding"

          echo "🧪 Testing API test page..."
          curl -f http://localhost:3000/stage_1_forkloop_frontend/api-test > /dev/null
          echo "✅ API test page is responding"

          echo "🔐 Testing auth test page..."
          curl -f http://localhost:3000/stage_1_forkloop_frontend/auth-test > /dev/null
          echo "✅ Auth test page is responding"

          echo "📊 Testing test dashboard..."
          curl -f http://localhost:3000/stage_1_forkloop_frontend/tests > /dev/null
          echo "✅ Test dashboard is responding"

  # Security Audit
  security:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # Only run TruffleHog with base/head on pull requests
      - name: Check for secrets (PR only)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      # For pushes, scan the current HEAD
      - name: Check for secrets (push only)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

  # Deploy to GitHub Pages (on main branch)
  deploy-gh-pages:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, api-tests, component-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # Notification
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [lint, build, api-tests, component-tests, security]
    if: always()

    steps:
      - name: Report Status
        run: |
          echo "🏁 CI/CD Pipeline Complete"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"  
          echo "API Tests: ${{ needs.api-tests.result }}"
          echo "Component Tests: ${{ needs.component-tests.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some jobs failed"
            exit 1
          else
            echo "✅ All jobs completed successfully"
          fi
